<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διεθνείς Ειδήσεις (Μεταφρασμένες)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .news-item {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
        }
        .news-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .news-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        .news-original-title {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 15px;
            font-style: italic;
        }
        .read-more {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .read-more:hover {
            background: #2980b9;
        }
        .source {
            float: right;
            font-size: 0.8em;
            color: #95a5a6;
            margin-top: 10px;
        }
        #loader {
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            color: #3498db;
        }
    </style>
</head>
<body>

    <h1>📰 Τελευταία Διεθνή Headlines</h1>
    <div id="loader">Γίνεται άντληση και μετάφραση ειδήσεων. Παρακαλώ περιμένετε...</div>
    <div id="news-container"></div>

    <script>
        // ΠΡΟΣΟΧΗ: Βάλε εδώ το δικό σου δωρεάν API Key από το gnews.io
        const GNEWS_API_KEY = 'ΒΑΛΕ_ΤΟ_API_KEY_ΣΟΥ_ΕΔΩ'; 
        
        // URL για τα κορυφαία διεθνή άρθρα στα αγγλικά
        const newsUrl = `https://gnews.io/api/v4/top-headlines?category=general&lang=en&max=5&apikey=${GNEWS_API_KEY}`;

        // Συνάρτηση για μετάφραση κειμένου (χρησιμοποιεί το δωρεάν MyMemory API)
        async function translateText(text) {
            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|el`);
                const data = await response.json();
                return data.responseData.translatedText;
            } catch (error) {
                console.error("Σφάλμα κατά τη μετάφραση:", error);
                return text; // Αν αποτύχει η μετάφραση, επιστρέφει το αγγλικό
            }
        }

        // Συνάρτηση για άντληση και εμφάνιση ειδήσεων
        async function fetchAndRenderNews() {
            const container = document.getElementById('news-container');
            const loader = document.getElementById('loader');

            try {
                const response = await fetch(newsUrl);
                const data = await response.json();

                if (data.errors) {
                    loader.innerText = "Σφάλμα: Βεβαιώσου ότι έβαλες το σωστό API Key.";
                    return;
                }

                loader.style.display = 'none'; // Κρύβουμε το μήνυμα φόρτωσης

                // Προσπελάζουμε κάθε άρθρο
                for (const article of data.articles) {
                    // Μεταφράζουμε τον τίτλο
                    const translatedTitle = await translateText(article.title);

                    // Δημιουργούμε το HTML block για την είδηση
                    const articleHTML = `
                        <div class="news-item">
                            <div class="news-title">🇬🇷 ${translatedTitle}</div>
                            <div class="news-original-title">🇬🇧 ${article.title}</div>
                            <a href="${article.url}" target="_blank" class="read-more">Διαβάστε το original άρθρο</a>
                            <span class="source">Πηγή: ${article.source.name}</span>
                        </div>
                    `;
                    
                    container.innerHTML += articleHTML;
                }
            } catch (error) {
                console.error("Σφάλμα κατά την άντληση ειδήσεων:", error);
                loader.innerText = "Υπήρξε πρόβλημα με τη φόρτωση των ειδήσεων.";
            }
        }

        // Ξεκινάμε τη διαδικασία μόλις φορτώσει η σελίδα
        fetchAndRenderNews();
    </script>
</body>
</html>
